<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Glowing Pill/Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #a7f3d0;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #6ee7b7;
    }
    .node-label {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #94a3b8;
    }
    
    /* Subtle background dynamic elements */
    @keyframes pulse-wave {
      0% { transform: scale(0.98); opacity: 0.3; }
      50% { transform: scale(1.02); opacity: 0.6; }
      100% { transform: scale(0.98); opacity: 0.3; }
    }
    @keyframes float-particle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }

    .animated-wave {
      animation: pulse-wave 6s ease-in-out infinite;
      transform-origin: center;
    }
    .animated-float {
      animation: float-particle 4s ease-in-out infinite;
    }
    .moving-grid {
      stroke-dasharray: 4, 8;
      animation: dash 20s linear infinite;
    }
  </style>

  <!-- Base Layer: Solid Dark Green/Slate Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Dynamic Network Flow Grid (Kept subtle and behind text) -->
  <g opacity="0.25">
    <path d="M 100 0 V 360 M 300 0 V 360 M 500 0 V 360 M 700 0 V 360 M 900 0 V 360 M 1100 0 V 360" stroke="#10b981" stroke-width="1" class="moving-grid"/>
    <path d="M 0 60 H 1200 M 0 120 H 1200 M 0 180 H 1200 M 0 240 H 1200 M 0 300 H 1200" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Background Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="120" fill="#059669" opacity="0.2" filter="url(#glow)" class="animated-wave"/>
  <circle cx="1050" cy="280" r="140" fill="#10b981" opacity="0.15" filter="url(#glow)" class="animated-wave"/>

  <!-- Lower Decorative Dynamic Cards/Pills (Positioned below main text area to prevent overlap) -->
  <g transform="translate(80, 245)">
    <!-- Card 1: Safety & Compliance -->
    <rect width="240" height="65" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="30" cy="32" r="14" fill="#10b981" fill-opacity="0.2"/>
    <path d="M 24 32 L 28 36 L 36 27" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="56" y="30" class="badge-text">Workplace Safety & OS&H</text>
    <text x="56" y="48" class="node-label">ISO 45001 • OSHA Compliance</text>

    <!-- Card 2: Environmental & Carbon -->
    <g transform="translate(260, 0)">
      <rect width="240" height="65" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="30" cy="32" r="14" fill="#10b981" fill-opacity="0.2"/>
      <path d="M 30 22 C 24 26 24 34 30 40 C 36 34 36 26 30 22 Z" stroke="#34d399" stroke-width="2" fill="none"/>
      <text x="56" y="30" class="badge-text">Environmental & ESG</text>
      <text x="56" y="48" class="node-label">ISO 14001 • Carbon & Waste</text>
    </g>

    <!-- Card 3: Enterprise & Risk -->
    <g transform="translate(520, 0)">
      <rect width="240" height="65" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="30" cy="32" r="14" fill="#10b981" fill-opacity="0.2"/>
      <path d="M 23 37 L 30 24 L 37 37 Z" stroke="#34d399" stroke-width="2" fill="none"/>
      <text x="56" y="30" class="badge-text">Operational Risk & Audits</text>
      <text x="56" y="48" class="node-label">Hazards • Incidents • CAPA</text>
    </g>

    <!-- Card 4: Open Source & Telemetry -->
    <g transform="translate(780, 0)">
      <rect width="260" height="65" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="30" cy="32" r="14" fill="#10b981" fill-opacity="0.2"/>
      <path d="M 24 32 H 36 M 30 26 V 38" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
      <text x="56" y="30" class="badge-text">Open Source Infrastructure</text>
      <text x="56" y="48" class="node-label">IoT Telemetry • Analytics Stack</text>
    </g>
  </g>

  <!-- Foreground Main Header & Title Content (Completely unobstructed) -->
  <!-- Top Category Tag -->
  <g transform="translate(80, 50)">
    <rect width="260" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
    <text x="130" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1">AWESOME EHS PLATFORMS</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="125" class="title">Environmental Health &amp; Safety Platform</text>
  
  <!-- Subtitle / Tagline -->
  <text x="80" y="165" class="subtitle">Curated Ecosystem of Enterprise SaaS Products &amp; Open-Source Safety Infrastructure</text>
  
  <!-- Subtle Divider Glow Line -->
  <rect x="80" y="195" width="1040" height="2" fill="url(#glow-line)"/>
</svg>
