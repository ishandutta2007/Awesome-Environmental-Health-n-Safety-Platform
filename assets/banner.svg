<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #a7f3d0;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #6ee7b7;
    }
    .node-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #94a3b8;
    }

    @keyframes pulse-bg {
      0% { opacity: 0.15; }
      50% { opacity: 0.35; }
      100% { opacity: 0.15; }
    }
    @keyframes move-dash {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -36; }
    }

    .animated-orb {
      animation: pulse-bg 5s ease-in-out infinite;
    }
    .grid-line {
      stroke-dasharray: 6, 6;
      animation: move-dash 15s linear infinite;
    }
  </style>

  <!-- Base Layer: Dark Green & Slate Gradient -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Animated Network Grid (Behind text) -->
  <g opacity="0.25">
    <path d="M 100 0 V 360 M 300 0 V 360 M 500 0 V 360 M 700 0 V 360 M 900 0 V 360 M 1100 0 V 360" stroke="#10b981" stroke-width="1" class="grid-line"/>
    <path d="M 0 60 H 1200 M 0 120 H 1200 M 0 180 H 1200 M 0 240 H 1200 M 0 300 H 1200" stroke="#10b981" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Background Orbs -->
  <circle cx="150" cy="80" r="120" fill="#059669" class="animated-orb"/>
  <circle cx="1050" cy="280" r="140" fill="#10b981" class="animated-orb"/>

  <!-- Lower Cards/Pills (Positioned cleanly below text) -->
  <g transform="translate(60, 245)">
    <!-- Card 1: Safety & Compliance -->
    <rect width="250" height="65" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="32" cy="32" r="14" fill="#10b981" fill-opacity="0.25"/>
    <path d="M 26 32 L 30 36 L 38 27" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="58" y="30" class="badge-text">Workplace Safety &amp; OS&amp;H</text>
    <text x="58" y="48" class="node-label">ISO 45001 • OSHA Compliance</text>

    <!-- Card 2: Environmental & Carbon -->
    <g transform="translate(265, 0)">
      <rect width="250" height="65" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="32" cy="32" r="14" fill="#10b981" fill-opacity="0.25"/>
      <path d="M 32 22 C 26 26 26 34 32 40 C 38 34 38 26 32 22 Z" stroke="#34d399" stroke-width="2" fill="none"/>
      <text x="58" y="30" class="badge-text">Environmental &amp; ESG</text>
      <text x="58" y="48" class="node-label">ISO 14001 • Carbon &amp; Waste</text>
    </g>

    <!-- Card 3: Enterprise & Risk -->
    <g transform="translate(530, 0)">
      <rect width="250" height="65" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="32" cy="32" r="14" fill="#10b981" fill-opacity="0.25"/>
      <path d="M 25 37 L 32 24 L 39 37 Z" stroke="#34d399" stroke-width="2" fill="none"/>
      <text x="58" y="30" class="badge-text">Operational Risk &amp; Audits</text>
      <text x="58" y="48" class="node-label">Hazards • Incidents • CAPA</text>
    </g>

    <!-- Card 4: Open Source Infrastructure -->
    <g transform="translate(795, 0)">
      <rect width="285" height="65" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="32" cy="32" r="14" fill="#10b981" fill-opacity="0.25"/>
      <path d="M 26 32 H 38 M 32 26 V 38" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
      <text x="58" y="30" class="badge-text">Open Source Infrastructure</text>
      <text x="58" y="48" class="node-label">IoT Telemetry • Analytics Stack</text>
    </g>
  </g>

  <!-- Foreground Main Header & Title Content -->
  <g transform="translate(60, 50)">
    <rect width="260" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
    <text x="130" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1">AWESOME EHS PLATFORMS</text>
  </g>

  <text x="60" y="125" class="title">Environmental Health &amp; Safety Platform</text>
  <text x="60" y="165" class="subtitle">Curated Ecosystem of Enterprise SaaS Products &amp; Open-Source Safety Infrastructure</text>

  <rect x="60" y="195" width="1080" height="2" fill="url(#glow-line)"/>
</svg>
